$schema: https://purposelab.dev/schemas/repository-manifest-v1.schema.json
schemaVersion: 1
repository:
  id: privacy-policies
  kind: legal
  description: Public PurposeLab privacy policies and terms
  paths:
    source: .
    policies: .
harness:
